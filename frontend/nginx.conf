# ==============================================================================
# CONFIGURACIÓN DE NGINX PARA TRIAGEDOC (SPA + REVERSE PROXY INTERNO)
# ==============================================================================
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Redirección de peticiones internas hacia la API (.NET) en la red Docker
    location /api/ {
        proxy_pass http://api-triagedoc:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Soporte para Enrutamiento SPA (Single Page Application en React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Caché eficiente para archivos estáticos empaquetados (JS/CSS)
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
