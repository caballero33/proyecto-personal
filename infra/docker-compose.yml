# ==============================================================================
# TEMA 4: ORQUESTACIÓN COMPLETA DE LA ARQUITECTURA (DOCKER COMPOSE)
# Servicios en Red Privada Virtual: PostgreSQL 16 + API (.NET 8) + Web (React/Nginx)
# Comando de ejecución: docker compose up --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # SERVICIO 1: Base de Datos Relacional (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  db-triagedoc:
    image: postgres:16-alpine
    container_name: postgres-triagedoc
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d TriageDocDB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - triagedoc-network

  # ----------------------------------------------------------------------------
  # SERVICIO 2: Backend API Core y Motor Experto (.NET 8 Clean Architecture)
  # ----------------------------------------------------------------------------
  api-triagedoc:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: api-triagedoc
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__PostgresConnection=Host=db-triagedoc;Port=5432;Database=TriageDocDB;Username=admin;Password=SuperSecretPassword123!
    ports:
      - "5000:8080"
    depends_on:
      db-triagedoc:
        condition: service_healthy
    networks:
      - triagedoc-network

  # ----------------------------------------------------------------------------
  # SERVICIO 3: Cliente Web SPA (React + Nginx Reverse Play)
  # ----------------------------------------------------------------------------
  web-triagedoc:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: web-triagedoc
    restart: always
    ports:
      - "8080:80"
      - "5173:80"
    depends_on:
      - api-triagedoc
    networks:
      - triagedoc-network

volumes:
  postgres_data:

networks:
  triagedoc-network:
    driver: bridge
