version: '3.8'

services:
  db-triagedoc:
    image: postgres:16-alpine
    container_name: postgres-triagedoc
    restart: always
    env_file:
      - .env # Inyecta las variables exclusivas del contenedor (Clase 4)
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
